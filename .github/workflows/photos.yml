name: Fetch Unsplash photos
on:
  push:
    paths: ['tools/photos.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and optimise
        run: |
          sudo apt-get install -y -qq webp >/dev/null
          mkdir -p assets/photos
          grep -v '^#' tools/photos.txt | while read -r name url; do
            [ -z "$name" ] && continue
            out="assets/photos/${name%.*}.webp"
            [ -f "$out" ] && continue
            curl -sfL "${url}&w=1400" -o /tmp/src.jpg && cwebp -quiet -q 72 -resize 1400 0 /tmp/src.jpg -o "$out" && echo "ok $out"
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/photos && git commit -m "Add Unsplash photos (auto)" && git push || echo "nothing to commit"
