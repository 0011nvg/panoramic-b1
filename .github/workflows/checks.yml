name: Site checks
# Автопроверка сайта при каждом push. Если что-то сломалось, коммит получает красный ✗.
#  · static  — все файлы на месте (точный регистр имён), ключи заданий корректны, Unit 2–10 помечены «скоро»
#  · browser — все уроки в Chrome на 375 / 820 / 1366 px: картинки грузятся, нет горизонтальной прокрутки,
#              нет ошибок в консоли, учительские материалы скрыты у ученика, каждый ключ даёт 100 %
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'tools/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/static.js
  browser:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Playwright
        run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: Local server
        run: (python3 -m http.server 8765 >/dev/null 2>&1 &) && sleep 2
      - run: node tests/qa.js http://localhost:8765/
