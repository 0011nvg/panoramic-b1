name: Generate illustrations (CellCog)
on:
  push:
    paths: ['tools/gen-prompts.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CELLCOG_API_KEY: ${{ secrets.CELLCOG_API_KEY }}
      CELLCOG_STATE_DIR: /tmp/cellcog
    steps:
      - uses: actions/checkout@v4
      - name: Check key
        id: key
        run: if [ -z "$CELLCOG_API_KEY" ]; then echo "Нет секрета CELLCOG_API_KEY — пропуск"; echo "ok=0" >> $GITHUB_OUTPUT; else echo "ok=1" >> $GITHUB_OUTPUT; fi
      - if: steps.key.outputs.ok == '1'
        run: |
          sudo apt-get install -y -qq webp >/dev/null
          pip install -q -U cellcog
          python tools/generate.py
      - if: steps.key.outputs.ok == '1'
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/gen && git commit -m "Add generated illustrations (CellCog)" && git push || echo "nothing to commit"
